[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rogues21"
version = "0.1.0"
description = "Roguelike game"
authors = [{name = "Leerov", email = "ZhmulevVV@gmail.com"}]
dependencies = ["pygame>=2.5.0"]

[project.scripts]
rogues21 = "rogues21:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "UP", "B", "C4", "SIM", "ARG", "PERF", "PL",
]
ignore = [
    "E501", "E731", "PLR0913", "PLR0912", "PLR0915", "UP037"
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py", "test.py"]
testpaths = ["tests"]
